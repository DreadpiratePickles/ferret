[package]
name = "ferrum-brain"
version.workspace = true
edition.workspace = true

[dependencies]
ferrum-proto = { path = "../ferrum-proto" }
ferrum-wroom-nrf = { path = "../ferrum-wroom-nrf" }
ferrum-c5-scout = { path = "../ferrum-c5-scout" }
ferrum-s3-sense = { path = "../ferrum-s3-sense" }
ferrum-secure = { path = "../ferrum-secure" }
ferrum-ids = { path = "../ferrum-ids" }
ferrum-deceive = { path = "../ferrum-deceive" }
ferrum-forensics = { path = "../ferrum-forensics" }
ferrum-triage = { path = "../ferrum-triage" }
ferrum-laya = { path = "../ferrum-laya" }
ferrum-hal = { path = "../ferrum-hal" }
ferrum-sim = { path = "../ferrum-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.7.9", features = ["ws"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.24"
